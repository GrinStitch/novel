spring:
  application:
    name: novel
  profiles:
    active: dev
  jackson:
    generator:
      write-bigdecimal-as-plain: true
  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: 8888


--- #------------------------数据库相关配置-----------------------
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/novel?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234

--- #------------------------redis相关配置-----------------------
spring:
  data:
    redis:
      database: 4
      host: localhost
      port: 6379
      password: 123456

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.stitch.mynovel.core.common.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null

--- #------------------------其他相关配置-----------------------
novel:
  jwt:
    secret: ${JWT_SECRET:myNovelDevSecretKey2026AtLeast32Bytes!}


